resolver 127.0.0.11 valid=10s;

limit_req_zone $binary_remote_addr zone=vote_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=result_limit:10m rate=10r/s;

server {
    listen 80;

    if ($request_method !~ ^(GET|POST)$) {
        return 405;
    }

    location /vote/ {
        limit_req zone=vote_limit burst=20 nodelay;
        set $vote_upstream http://vote:80/;
        proxy_pass $vote_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    # Redirige /vote (sans slash) vers /vote/ pour que le navigateur
    # charge correctement les fichiers static/CSS ensuite
    location = /vote {
        return 301 /vote/;
    }

    location /result/ {
        limit_req zone=result_limit burst=20 nodelay;
        set $result_upstream http://result:80/;
        proxy_pass $result_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    location = /result {
        return 301 /result/;
    }

    location = / {
        return 302 /vote/;
    }
}