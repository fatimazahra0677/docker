resolver 127.0.0.11 valid=10s;

limit_req_zone $binary_remote_addr zone=vote_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=result_limit:10m rate=10r/s;

server {
    listen 80;

    if ($request_method !~ ^(GET|POST)$) {
        return 405;
    }

    location /vote/ {
        limit_req zone=vote_limit burst=20 nodelay;
        set $vote_upstream http://vote:80/;
        proxy_pass $vote_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    location = /vote {
        return 301 /vote/;
    }

    location /static/ {
        set $static_upstream http://vote:80;
        proxy_pass $static_upstream$request_uri;
    }

    location /result/ {
        limit_req zone=result_limit burst=20 nodelay;
        set $result_upstream http://result:80/;
        proxy_pass $result_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    location = /result {
        return 301 /result/;
    }

    location ~ ^/result/(socket\.io\.js|angular\.min\.js|app\.js)$ {
        set $result_backend http://result:80;
        proxy_pass $result_backend/$1;
    }

    location /stylesheets/ {
        set $result_static http://result:80;
        proxy_pass $result_static$request_uri;
    }

        location /socket.io/ {
        set $socketio_backend http://result:80;
        proxy_pass $socketio_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location = / {
        return 302 /vote/;
    }
}