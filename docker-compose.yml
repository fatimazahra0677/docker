
services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
    networks:
      fr-net:
        ipv4_address: 172.20.1.10
    depends_on:
      - vote
      - result

  vote:
    build:
      context: ./vote
      target: final
    expose:
      - "80"
    networks:
      fr-net:
        ipv4_address: 172.20.1.20
    user: "999:999"
    extra_hosts:
      - "redis:172.20.2.10"

  result:
    build: ./result
    expose:
      - "80"
    networks:
      fr-net:
        ipv4_address: 172.20.1.30
    user: "999:999"
    extra_hosts:
      - "db:172.20.3.10"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  redis:
    image: redis:alpine
    networks:
      bk-net:
        ipv4_address: 172.20.2.10
    user: "999:999"

  worker:
    build: ./worker
    networks:
      bk-net:
        ipv4_address: 172.20.2.20
    user: "999:999"
    extra_hosts:
      - "db:172.20.3.10"

  db:
    image: postgres:15-alpine
    networks:
      db-net:
        ipv4_address: 172.20.3.10
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data

  firewall-init:
    image: justincormack/nsenter1
    privileged: true
    pid: host
    network_mode: host
    restart: unless-stopped
    depends_on:
      - vote
      - redis
      - worker
      - db
      - result
    entrypoint: ["/usr/bin/nsenter1"]
    command:
      - /bin/sh
      - -c
      - |
        set -eu

        iptables -C DOCKER-USER -s 172.20.1.20 -d 172.20.2.10 -p tcp --dport 6379 -j ACCEPT 2>/dev/null || iptables -I DOCKER-USER -s 172.20.1.20 -d 172.20.2.10 -p tcp --dport 6379 -j ACCEPT

        iptables -C DOCKER-USER -s 172.20.2.20 -d 172.20.3.10 -p tcp --dport 5432 -j ACCEPT 2>/dev/null || iptables -I DOCKER-USER -s 172.20.2.20 -d 172.20.3.10 -p tcp --dport 5432 -j ACCEPT

        iptables -C DOCKER-USER -s 172.20.1.30 -d 172.20.3.10 -p tcp --dport 5432 -j ACCEPT 2>/dev/null || iptables -I DOCKER-USER -s 172.20.1.30 -d 172.20.3.10 -p tcp --dport 5432 -j ACCEPT

        iptables -C DOCKER-USER -m state --state ESTABLISHED,RELATED -j ACCEPT 2>/dev/null || iptables -I DOCKER-USER -m state --state ESTABLISHED,RELATED -j ACCEPT

        echo "Firewall rules initialized successfully"

        while true; do sleep 3600; done

networks:
  fr-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24

  bk-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.2.0/24

  db-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.3.0/24

volumes:
  db-data:
