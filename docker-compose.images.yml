services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
    networks:
      fr-net:
        ipv4_address: 172.20.1.10
    depends_on:
      - vote
      - result

  vote:
    build:
      context: ./vote
      target: final
    expose:
      - "80"
    networks:
      fr-net:
        ipv4_address: 172.20.1.20
    user: "999:999"

  result:
    build:
      context: ./result
    expose:
      - "80"
    networks:
      fr-net:
        ipv4_address: 172.20.1.30
    user: "999:999"

  redis:
    image: redis:alpine
    networks:
      bk-net:
        ipv4_address: 172.20.2.10
    user: "999:999"

  worker:
    build: ./worker
    networks:
      bk-net:
        ipv4_address: 172.20.2.20
    user: "999:999"

  db:
    image: postgres:15-alpine
    networks:
      db-net:
        ipv4_address: 172.20.3.10
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data

networks:
  fr-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24
  bk-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.2.0/24
  db-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.3.0/24

volumes:
  db-data: